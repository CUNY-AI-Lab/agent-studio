name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit --audit-level high

      - name: Repository check
        run: bun run check

      - name: Write local Worker variables
        run: |
          umask 077
          cat > cloudflare/.dev.vars <<'EOF'
          SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CAIL_MODEL=@cf/zai-org/glm-5.2
          CAIL_REQUIRE_IDENTITY=false
          CAIL_BASE_PATH=/agent-studio
          CAIL_IDENTITY_JWKS=
          CAIL_IDENTITY_ISSUER=
          EOF

      - name: Local Worker process integration smoke (not E2E)
        run: |
          set -euo pipefail

          worker_log=/tmp/agent-studio-worker.log
          worker_pid=''

          cleanup() {
            if [[ -n "$worker_pid" ]]; then
              kill "$worker_pid" >/dev/null 2>&1 || true
              wait "$worker_pid" >/dev/null 2>&1 || true
            fi
          }

          show_worker_log() {
            if [[ -f "$worker_log" ]]; then
              echo 'Worker log (credentials redacted):' >&2
              sed -E \
                -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1[redacted]/g' \
                -e 's/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[jwt redacted]/g' \
                -e 's/cail-[A-Za-z0-9_-]+/[subject redacted]/g' \
                -e 's/[A-Fa-f0-9]{24,}/[id redacted]/g' \
                -e 's#https?://[^[:space:]]+#[url redacted]#g' \
                -e 's/[^[:space:]@]+@[^[:space:]@]+/[email redacted]/g' \
                "$worker_log" >&2
            fi
          }

          trap cleanup EXIT
          bun run dev >"$worker_log" 2>&1 &
          worker_pid=$!

          if ! bun run smoke -- --base-url http://127.0.0.1:8787/agent-studio; then
            show_worker_log
            exit 1
          fi

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: agent-studio-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Confirm main has not advanced
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$current_sha" == "$GITHUB_SHA" ]]
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy the exact main commit
        working-directory: cloudflare
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          bunx wrangler deploy \
            --strict \
            --tag "$GITHUB_SHA" \
            --message "main $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Read back the deployed version
        id: version
        working-directory: cloudflare
        run: |
          set -euo pipefail
          versions="$(bunx wrangler versions list --name agent-studio --json 2>/dev/null)"
          version_id="$(jq -r --arg tag "$GITHUB_SHA" --arg message "main $GITHUB_SHA" '
            [ .[]
              | select(.annotations["workers/tag"] == $tag)
              | select(.annotations["workers/message"] == $message)
            ]
            | sort_by(.metadata.created_on)
            | last
            | .id // empty
          ' <<<"$versions")"
          [[ "$version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          version="$(bunx wrangler versions view "$version_id" --name agent-studio --json 2>/dev/null)"
          jq -e --arg tag "$GITHUB_SHA" --arg message "main $GITHUB_SHA" '
            .annotations["workers/tag"] == $tag
            and .annotations["workers/message"] == $message
          ' <<<"$version" >/dev/null
          jq -e '
            .resources.script_runtime.compatibility_flags ==
              ["nodejs_compat", "enable_request_signal", "request_signal_passthrough"] and
            .resources.script_runtime.exports.AgentStudioReadiness.type == "worker" and
            ([.resources.bindings[]?
              | select(.type == "service"
                and .name == "GATEWAY"
                and .service == "cail-model-api"
                and ((.entrypoint // "") == ""))] | length) == 1 and
            ([.resources.bindings[]?
              | select(.type == "r2_bucket"
                and .name == "WORKSPACE_FILES"
                and .bucket_name == "agent-studio")] | length) == 1 and
            ([.resources.bindings[]?
              | select(.type == "plain_text"
                and .name == "CAIL_API_BASE"
                and .text == "https://tools.ailab.gc.cuny.edu")] | length) == 1 and
            ([.resources.bindings[]?
              | select(.type == "plain_text"
                and .name == "CAIL_CANONICAL_ORIGIN"
                and .text == "https://tools.ailab.gc.cuny.edu")] | length) == 1 and
            ([.resources.bindings[]?
              | select(.type == "plain_text"
                and .name == "CAIL_BASE_PATH"
                and .text == "/agent-studio")] | length) == 1 and
            ([.resources.bindings[]?
              | select(.type == "plain_text"
                and .name == "CAIL_IDENTITY_ISSUER"
                and .text == "https://tools.ailab.gc.cuny.edu/cail-sso")] | length) == 1 and
            ([.resources.bindings[]?
              | select(.type == "plain_text"
                and .name == "CAIL_REQUIRE_IDENTITY"
                and .text == "true")] | length) == 1 and
            ([.resources.bindings[]?
              | select(.type == "service" and (.service | contains("staging")))] | length) == 0
          ' <<<"$version" >/dev/null
          deployments="$(bunx wrangler deployments list --name agent-studio --json 2>/dev/null)"
          deployment_id="$(jq -r --arg id "$version_id" --arg message "main $GITHUB_SHA" '
            [ .[] ]
            | sort_by(.created_on)
            | last
            | select(.annotations["workers/message"] == $message)
            | select((.versions | length) == 1)
            | select(.versions[0].version_id == $id and .versions[0].percentage == 100)
            | .id // empty
          ' <<<"$deployments")"
          [[ "$deployment_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
          api='https://api.cloudflare.com/client/v4'
          account_id='452c33847cf5cb1e46f391fca32fd1b5'
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          subdomain="$(curl --fail --silent --show-error \
            "${api}/accounts/${account_id}/workers/scripts/agent-studio/subdomain" \
            --header "$auth")"
          jq -e '
            .success == true
            and .result.enabled == false
            and .result.previews_enabled == false
          ' <<<"$subdomain" >/dev/null

          route_inventory="$(mktemp)"
          trap 'rm -f "$route_inventory"' EXIT
          zone_page=1
          while :; do
            zones="$(curl --fail --silent --show-error \
              "${api}/zones?account.id=${account_id}&type=full,partial,secondary,internal&per_page=50&page=${zone_page}" \
              --header "$auth")"
            jq -e '
              .success == true
              and (.result | type) == "array"
              and ((.result_info.total_pages // 1) | type) == "number"
            ' <<<"$zones" >/dev/null
            zone_total_pages="$(jq -r '.result_info.total_pages // 1' <<<"$zones")"
            [[ "$zone_total_pages" =~ ^[1-9][0-9]*$ ]]
            while IFS=$'\t' read -r zone_id zone_name; do
              routes="$(curl --fail --silent --show-error \
                "${api}/zones/${zone_id}/workers/routes" \
                --header "$auth")"
              jq -e '
                .success == true
                and (.result | type) == "array"
              ' <<<"$routes" >/dev/null
              jq -r --arg zone_id "$zone_id" --arg zone_name "$zone_name" '
                .result[]?
                | select(.script == "agent-studio")
                | [$zone_id, $zone_name, .id, .pattern, .script]
                | @tsv
              ' <<<"$routes" >> "$route_inventory"
            done < <(jq -r '.result[] | [.id, .name] | @tsv' <<<"$zones")
            (( zone_page >= zone_total_pages )) && break
            (( zone_page += 1 ))
          done
          if [[ -s "$route_inventory" ]]; then
            echo 'Agent Studio must not own a production custom route; route inventory found:' >&2
            cat "$route_inventory" >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Probe private Agent Studio readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_VERSION_ID: ${{ steps.version.outputs.version_id }}
        run: |
          set -euo pipefail
          readiness_log="$(mktemp)"
          readiness_pid=''
          cleanup() {
            if [[ -n "$readiness_pid" ]]; then
              kill "$readiness_pid" >/dev/null 2>&1 || true
              wait "$readiness_pid" >/dev/null 2>&1 || true
            fi
            rm -f "$readiness_log"
          }
          trap cleanup EXIT

          # This helper is local, but its one service binding is explicitly
          # remote. Wrangler's current per-binding remote mode keeps the helper
          # process local while invoking the deployed named WorkerEntrypoint;
          # do not replace this with the legacy whole-process remote mode.
          bunx wrangler dev \
            --config scripts/release-readiness-wrangler.jsonc \
            --ip 127.0.0.1 \
            --port 8798 \
            >"$readiness_log" 2>&1 &
          readiness_pid=$!

          deadline_ms=$(( $(date +%s%3N) + 120000 ))
          while :; do
            now_ms=$(date +%s%3N)
            (( now_ms >= deadline_ms )) && break
            remaining_ms=$(( deadline_ms - now_ms ))
            request_timeout=$(( (remaining_ms + 999) / 1000 ))
            (( request_timeout > 10 )) && request_timeout=10
            readiness="$(curl --silent --show-error --max-time "$request_timeout" \
              http://127.0.0.1:8798/readiness 2>/dev/null || true)"
            if jq -e --arg id "$EXPECTED_VERSION_ID" --arg tag "$GITHUB_SHA" '
              type == "object"
              and (keys | sort) == ["configuration", "ok", "service", "tag", "version_id"]
              and .ok == true
              and .service == "agent-studio"
              and .configuration == "ready"
              and .version_id == $id
              and .tag == $tag
            ' <<<"$readiness" >/dev/null 2>&1; then
              exit 0
            fi
            now_ms=$(date +%s%3N)
            (( now_ms >= deadline_ms )) && break
            remaining_ms=$(( deadline_ms - now_ms ))
            if (( remaining_ms > 2000 )); then
              sleep 2
            elif (( remaining_ms > 1000 )); then
              sleep 1
            else
              sleep 0.2
            fi
          done
          echo 'private Agent Studio readiness did not reach the expected version within 120s' >&2
          exit 1

      - name: Probe canonical Doorway routes
        run: |
          set -euo pipefail
          origin='https://tools.ailab.gc.cuny.edu'
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT

          # A newly deployed Worker can take a short, bounded interval to
          # appear through the canonical Doorway binding. Only an absent route
          # or transient transport error is retryable; an incorrect status or
          # body fails the release immediately.
          probe_sso_redirect() {
            local url="$1"
            local deadline_ms=$(( $(date +%s%3N) + 120000 ))
            while :; do
              local now_ms
              now_ms=$(date +%s%3N)
              (( now_ms >= deadline_ms )) && break
              local remaining_ms=$(( deadline_ms - now_ms ))
              local request_timeout=$(( (remaining_ms + 999) / 1000 ))
              (( request_timeout > 10 )) && request_timeout=10
              local code
              code="$(curl --silent --show-error --max-time "$request_timeout" \
                --dump-header "$headers" --output "$body" \
                --write-out '%{http_code}' \
                --header 'Cache-Control: no-cache' "$url" 2>/dev/null || true)"
              if [[ "$code" == 302 ]]; then
                awk 'BEGIN { IGNORECASE=1 } /^location:/ {
                  sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit
                }' "$headers" | grep -Eq '^https://ssologin\.cuny\.edu/oauth2/rest/authorize\?'
                return 0
              fi
              if [[ -n "$code" && "$code" != 000 && "$code" != 404 ]]; then
                echo 'canonical Agent Studio UI did not return the Doorway SSO redirect' >&2
                return 1
              fi
              now_ms=$(date +%s%3N)
              (( now_ms >= deadline_ms )) && break
              remaining_ms=$(( deadline_ms - now_ms ))
              if (( remaining_ms > 2000 )); then
                sleep 2
              elif (( remaining_ms > 1000 )); then
                sleep 1
              else
                sleep 0.2
              fi
            done
            echo 'canonical Agent Studio UI route did not propagate within 120s' >&2
            return 1
          }

          probe_unauthenticated_api() {
            local url="$1"
            local deadline_ms=$(( $(date +%s%3N) + 120000 ))
            while :; do
              local now_ms
              now_ms=$(date +%s%3N)
              (( now_ms >= deadline_ms )) && break
              local remaining_ms=$(( deadline_ms - now_ms ))
              local request_timeout=$(( (remaining_ms + 999) / 1000 ))
              (( request_timeout > 10 )) && request_timeout=10
              local code
              code="$(curl --silent --show-error --max-time "$request_timeout" \
                --dump-header "$headers" --output "$body" \
                --write-out '%{http_code}' \
                --header 'Cache-Control: no-cache' "$url" 2>/dev/null || true)"
              if [[ "$code" == 401 ]]; then
                jq -e '
                  type == "object"
                  and (keys | sort) == ["error"]
                  and (.error | type) == "object"
                  and ((.error | keys | sort) == ["code", "launch", "message"])
                  and .error.code == "authentication_required"
                  and .error.message == "Please sign in to continue."
                  and .error.launch == "/launch/agent-studio"
                ' "$body" >/dev/null
                grep -iq '^cache-control: no-store' "$headers"
                return 0
              fi
              if [[ -n "$code" && "$code" != 000 && "$code" != 404 ]]; then
                echo 'canonical Agent Studio API did not return a bounded 401' >&2
                return 1
              fi
              now_ms=$(date +%s%3N)
              (( now_ms >= deadline_ms )) && break
              remaining_ms=$(( deadline_ms - now_ms ))
              if (( remaining_ms > 2000 )); then
                sleep 2
              elif (( remaining_ms > 1000 )); then
                sleep 1
              else
                sleep 0.2
              fi
            done
            echo 'canonical Agent Studio API route did not propagate within 120s' >&2
            return 1
          }

          probe_sso_redirect "$origin/agent-studio/"
          probe_unauthenticated_api "$origin/agent-studio/api/session"
